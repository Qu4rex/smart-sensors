# Только для локальной разработки: docker compose подключает этот файл автоматически.
# На сервер он НЕ копируется (см. deploy/rsync-exclude.txt), поэтому там порты базы и backend закрыты.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    ports:
      - "127.0.0.1:8000:8000"