[project]
name = "hackathon-backend"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.14"
dependencies = [
"fastapi>=0.162.0",
"uvicorn[standart]>=0.54.0",
]

[tool.uv]
# Приложение, а не библиотека: пакет не собираем, только ставим зависимости.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
# Миграции Alembic генерируются автоматически, их стиль не правим.
extend-exclude = ["migration/versions"]

[tool.ruff.lint]
select = [
"E", # pycodestyle: ошибки
"W", # pycodestyle: предупреждения
"F", # pyflakes
"I", # isort: порядок импортов
"B", # bugbear: типичные ошибки
"UP", # pyupgrade: современный синтаксис
"C4", # comprehensions
"SIM", # упрощение кода
"ASYNC",
"PT", # pytest
]

[tool.ruff.format]
quote-style = "double"